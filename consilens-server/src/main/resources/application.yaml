spring:
  main:
    banner-mode: off
  application:
    name: consilens-server
  profiles:
    # 默认使用本机 mysql（localhost:3306，见下方 mysql profile），而非内嵌 H2
    default: mysql

mybatis-plus:
  type-enums-package: com.consilens.server.domain.enums

server:
  port: 16789

management:
  endpoints:
    web:
      exposure:
        include: health,info

consilens:
  server:
    datasource:
      # Base64 编码的 32 字节 AES 密钥（本机开发环境固定值；更换后已保存的数据源密码将无法解密，
      # 需要在页面上重新保存各数据源密码）。生产部署应改回环境变量注入并轮换此值。
      encryption-key: qL7vN2pX8sKd4Rm9TcW1yHb6Fj3Ge5UaZx0Oi8VbAwM=
    node:
      node-key:
      heartbeat-interval-seconds: 2
      expire-seconds: 30
    scheduler:
      enabled: true
      command-poll-interval-ms: 1000
      claim-lease-seconds: 15
      execute-threads: 2
      execute-queue-capacity: 1024
      recovery-batch-size: 64
      max-retry-count: 3
    artifact:
      storage-type: local-file
      local-base-dir: ./.consilens-server/artifacts
      max-content-bytes: 52428800
      diff-sample-rows: 1000
    run-log:
      # 每个运行实例一个 <instanceKey>.log，供实例详情页“运行日志”Tab 读取
      enabled: true
      dir: ./.consilens-server/logs
    database:
      allow-embedded: false
      time-zone:
    api:
      max-request-body-bytes: 10485760

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:consilens_server;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always

consilens:
  server:
    database:
      allow-embedded: true
    security:
      enabled: false

---
---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/consilens?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    # 本机开发库（/usr/local/mysql，localhost:3306）口令；生产部署改回环境变量注入
    password: 123456@szh
  quartz:
    properties:
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate

consilens:
  server:
    database:
      allow-embedded: false
    security:
      enabled: false
      api-key:
