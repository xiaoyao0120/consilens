spring:
  main:
    banner-mode: off
  application:
    name: consilens-server
  profiles:
    default: local

mybatis-plus:
  type-enums-package: com.consilens.server.domain.enums

server:
  port: 16789

management:
  endpoints:
    web:
      exposure:
        include: health,info

consilens:
  server:
    datasource:
      # Base64 编码的 32 字节 AES 密钥；未配置时数据源密码以明文存储（开发环境）
      encryption-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    node:
      node-key:
      heartbeat-interval-seconds: 2
      expire-seconds: 30
      topology-refresh-seconds: 3
    scheduler:
      enabled: true
      command-poll-interval-ms: 1000
      claim-lease-seconds: 15
      execute-threads: 2
      execute-queue-capacity: 1024
      recovery-batch-size: 64
      max-retry-count: 3
    artifact:
      storage-type: local-file
      local-base-dir: ./.consilens-server/artifacts
      max-content-bytes: 52428800
    database:
      allow-embedded: false
      time-zone:
    api:
      max-request-body-bytes: 10485760
    ai:
      enabled: true
      backend: deepseek
      model: deepseek-v4-flash
      base-url: https://opencode.ai/zen/go/v1
      api-key-env: DEEPSEEK_API_KEY
      api-key: sk-7bCMJlJGuYBLBJ9S0R9zTDeJfEuW8ANEqMYlJs3YNIHJFxtV5PeDD7zS4LJ7HHJo
      max-turns: 8
      max-tool-calls: 20
      run-timeout-seconds: 120
      tool-timeout-seconds: 30
      lease-seconds: 30
      secret-ttl-seconds: 600
      secret-max-reads: 8
      secret-store: encrypted-db
      secret-key-env: CONSILENS_AGENT_SECRET_KEY
      secret-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      max-concurrent-runs: 4
      fail-fast: true

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:consilens_server;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always

consilens:
  server:
    database:
      allow-embedded: true
    security:
      enabled: false

---
---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/consilens?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456@szh
  quartz:
    properties:
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate

consilens:
  server:
    database:
      allow-embedded: false
    security:
      enabled: false
      api-key:
    ai:
      # mysql 开发 profile：缺 key 时只标记 AI unavailable，不阻止整个 Server 启动；
      # 真正使用 AI 时仍需配置 DEEPSEEK_API_KEY / CONSILENS_AGENT_SECRET_KEY /
      # CONSILENS_DATASOURCE_ENCRYPTION_KEY 三个环境变量。
      fail-fast: false
