spring:
  main:
    banner-mode: off
  application:
    name: consilens-server
  profiles:
    default: local

mybatis-plus:
  type-enums-package: com.consilens.server.domain.enums

server:
  port: 18080

management:
  endpoints:
    web:
      exposure:
        include: health,info

consilens:
  server:
    datasource:
      # Base64 编码的 32 字节 AES 密钥；未配置时数据源密码以明文存储（开发环境）
      encryption-key: ${CONSILENS_DATASOURCE_ENCRYPTION_KEY:}
    node:
      node-key:
      heartbeat-interval-seconds: 2
      expire-seconds: 30
      topology-refresh-seconds: 3
    scheduler:
      enabled: true
      command-poll-interval-ms: 1000
      claim-lease-seconds: 15
      execute-threads: 2
      execute-queue-capacity: 1024
      recovery-batch-size: 64
      max-retry-count: 3
    artifact:
      storage-type: local-file
      local-base-dir: ./.consilens-server/artifacts
      max-content-bytes: 52428800
    database:
      allow-embedded: false
      time-zone:
    api:
      max-request-body-bytes: 10485760

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:consilens_server;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always

consilens:
  server:
    database:
      allow-embedded: true
    security:
      enabled: false

---
---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/consilens?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456@szh
  quartz:
    properties:
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate

consilens:
  server:
    database:
      allow-embedded: false
    security:
      enabled: false
      api-key:
