source:
  type: mysql
  name: source-mysql
  connection:
    url: jdbc:mysql://HOST:3306/DB
    username: USER
    password: PASS
  resource:
    type: table
    name: my_table
target:
  type: postgresql
  name: target-postgresql
  connection:
    url: jdbc:postgresql://HOST:5432/DB
    username: USER
    password: PASS
  resource:
    type: table
    name: my_table
comparison:
  keys:
    source:
      - id
    target:
      - id
strategy:
  mode: checksum
result:
  sinks:
    - format: console
      type: result
