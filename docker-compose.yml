#
# docker-compose.yml for consilens-server
#
# Spins up a MySQL 8 database (with seeded test data) alongside
# the consilens-server so you can run end-to-end diff tasks.
#
# Usage:
#   docker compose up --build -d
#   docker compose down -v   # teardown
#

services:
  # ---------------------------------------------------------
  # MySQL: holds source_db and target_db for diff comparison
  # ---------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: consilens-mysql
    environment:
      MYSQL_ROOT_PASSWORD: consilens123
      MYSQL_DATABASE: source_db
    ports:
      - "13306:3306"
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pconsilens123"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    networks:
      - consilens-net

  # ---------------------------------------------------------
  # consilens-server: runs the Spring Boot compare service
  # ---------------------------------------------------------
  consilens-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: consilens-server:latest
    container_name: consilens-server
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "18080:18080"
    environment:
      SPRING_PROFILES_ACTIVE: local
    volumes:
      - artifact_data:/opt/consilens/.consilens-server/artifacts
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:18080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - consilens-net

volumes:
  mysql_data:
  artifact_data:

networks:
  consilens-net:
    driver: bridge
