# MySQL 到 Oracle 跨数据库 Checksum 比对配置
# 适用于 MySQL 数据迁移到 Oracle 后的数据校验场景
# 使用 Checksum 模式，支持跨不同数据库引擎的比对
#
# 前置条件：
#   1. MySQL 中已加载 examples/seed-sql/load-mysql-consilens-demo-data.sql
#   2. Oracle 中已加载 examples/seed-sql/load-oracle-consilens-demo-data.sql
#   3. 设置环境变量 MYSQL_USER, MYSQL_PASSWORD, ORACLE_USER, ORACLE_PASSWORD

source:
  type: mysql
  name: source-mysql
  connection:
    url: jdbc:mysql://localhost:3306/consilens_demo?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${env.MYSQL_USER}
    password: ${env.MYSQL_PASSWORD}
  resource:
    type: table
    name: consilens_performance_demo_table

target:
  type: oracle
  name: target-oracle
  connection:
    url: jdbc:oracle:thin:@localhost:1521:ORCL
    username: ${env.ORACLE_USER}
    password: ${env.ORACLE_PASSWORD}
  resource:
    type: table
    name: CONSILENS_PERFORMANCE_DEMO_TABLE

comparison:
  keys:
    source:
      - record_id
    target:
      - RECORD_ID

  fields:
    source:
      - col_tinyint
      - col_smallint
      - col_mediumint
      - col_int
      - col_bigint
      - col_decimal
      - col_numeric
      - col_varchar_50
      - col_varchar_100
      - col_varchar_255
      - col_date
      - col_datetime
      - col_timestamp
      - user_name
      - email
      - phone
      - amount
      - balance
      - credit_limit
      - status
      - category
      - priority
      - score
      - created_at
      - updated_at
    target:
      - COL_TINYINT
      - COL_SMALLINT
      - COL_MEDIUMINT
      - COL_INT
      - COL_BIGINT
      - COL_DECIMAL
      - COL_NUMERIC
      - COL_VARCHAR_50
      - COL_VARCHAR_100
      - COL_VARCHAR_255
      - COL_DATE
      - COL_DATETIME
      - COL_TIMESTAMP
      - USER_NAME
      - EMAIL
      - PHONE
      - AMOUNT
      - BALANCE
      - CREDIT_LIMIT
      - STATUS
      - CATEGORY
      - PRIORITY
      - SCORE
      - CREATED_AT
      - UPDATED_AT

  filters:
    source: "dt >= '2026-05-01'"
    target: "DT >= TO_DATE('2026-05-01', 'YYYY-MM-DD')"

strategy:
  mode: checksum
  algorithm: xor
  bisectionFactor: 8
  bisectionThreshold: 8000
  batchSize: 1000
  enableProfiling: true

normalization:
  global:
    decimal:
      precision: 4
      rounding: true
    float:
      precision: 4
      rounding: false
    date:
      format: yyyy-MM-dd
      comparisonMode: DATE_ONLY
    datetime:
      format: yyyy-MM-dd HH:mm:ss
      timezone: Asia/Shanghai
      comparisonMode: "TRUNCATE_TO_SECOND"
    timestamp:
      format: yyyy-MM-dd HH:mm:ss
      timezone: Asia/Shanghai
      comparisonMode: "TRUNCATE_TO_SECOND"

result:
  sinks:
    - format: console
      type: result
