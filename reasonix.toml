[permissions]
allow = ["Bash=H2JAR=$(find /Users/szh/.m2/repository/com/h2database/h2 -name \"h2-2.1.214.jar\" | head -1); echo \"jar: $H2JAR\"; mkdir -p /tmp/h2test && cat > /tmp/h2test/H2Test.java <<'EOF'\nimport java.sql.*;\npublic class H2Test {\n    public static void main(String[] args) throws Exception {\n        String url = \"jdbc:h2:mem:consilens_server;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false\";\n        Connection c1 = DriverManager.getConnection(url, \"sa\", \"\");\n        c1.createStatement().execute(\"CREATE TABLE IF NOT EXISTS cs_server_node (id INT PRIMARY KEY, node_key VARCHAR(64))\");\n        c1.createStatement().execute(\"INSERT INTO cs_server_node (id, node_key) VALUES (1, 'n1')\");\n        System.out.println(\"created + inserted, closing all connections\");\n        c1.close();\n        // 模拟连接池全部关闭后重新连接\n        Connection c2 = DriverManager.getConnection(url, \"sa\", \"\");\n        try (ResultSet rs = c2.createStatement().executeQuery(\"SELECT COUNT(*) FROM cs_server_node\")) {\n            rs.next();\n            System.out.println(\"after full close+reopen, rows = \" + rs.getInt(1));\n        }\n        c2.close();\n        // 模拟 Hikari 连接全关（无 DB_CLOSE_DELAY 的另一种连接）后\n        Connection c3 = DriverManager.getConnection(\"jdbc:h2:mem:consilens_server;MODE=MySQL;DATABASE_TO_UPPER=false\", \"sa\", \"\");\n        try (ResultSet rs = c3.createStatement().executeQuery(\"SELECT COUNT(*) FROM cs_server_node\")) {\n            rs.next();\n            System.out.println(\"after connection WITHOUT DB_CLOSE_DELAY, rows = \" + rs.getInt(1));\n        }\n        c3.close();\n    }\n}\nEOF\ncd /tmp/h2test && javac H2Test.java && java -cp .:$H2JAR H2Test"]
